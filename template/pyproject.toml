[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdaeco-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["usdaeco-toolchain>=0.2,<0.3"]

[project.scripts]
aeco-example = "usdaeco_example.cli:main"

[tool.setuptools]
packages = ["usdaeco_example", "usdAecoExampleValidators"]
package-dir = {usdaeco_example = "tools/usdaeco_example", usdAecoExampleValidators = "usdAecoExampleValidators"}

[tool.setuptools.package-data]
usdAecoExampleValidators = ["plugInfo.json"]

[tool.pytest.ini_options]
testpaths = ["testenv"]
python_files = ["test*.py"]
